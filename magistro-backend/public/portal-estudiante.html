<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Estudiantes — MAGISTRO</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
:root {
  --bg: #fdf6f0; --surface: #ffffff; --surface2: #fdf0e6;
  --border: rgba(140,60,10,0.12); --border2: rgba(140,60,10,0.22);
  --text: #2d1206; --text2: #7a4020; --text3: #b8845a; --accent: #c44a12;
  --green-bg:#eaf3de;--green-text:#3b6d11;
  --blue-bg:#e6f1fb;--blue-text:#185fa5;
  --red-bg:#fcebeb;--red-text:#a32d2d;
  --amber-bg:#fff3d6;--amber-text:#7a4a00;
  --gray-bg:#f5ede6;--gray-text:#6b4530;
  --radius:8px; --radius-lg:12px;
}
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); font-size:14px; min-height:100vh; }
.wrap { max-width:820px; margin:0 auto; padding:24px 16px 60px; }
h1 { font-size:20px; margin-bottom:2px; }
.muted { color:var(--text2); font-size:13px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; }
input { width:100%; padding:10px 12px; border:1px solid var(--border2); border-radius:8px; font-size:14px; margin-bottom:14px; }
button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
button.secondary { background:var(--surface); color:var(--text); border:1px solid var(--border2); }
.error-box { background:var(--red-bg); color:var(--red-text); font-size:12.5px; padding:8px 10px; border-radius:8px; margin-bottom:14px; display:none; }
.tabs { display:flex; gap:6px; margin:20px 0 16px; flex-wrap:wrap; }
.tab { padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--border2); background:var(--surface); color:var(--text2); }
.tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.opcion { padding:12px 14px; border:1px solid var(--border2); border-radius:10px; margin-bottom:10px; cursor:pointer; }
.opcion:hover { border-color:var(--accent); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; }
th { color:var(--text3); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
.badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:600; }
.b-promo { background:var(--green-bg); color:var(--green-text); }
.b-aprobado { background:var(--blue-bg); color:var(--blue-text); }
.b-reprobado { background:var(--red-bg); color:var(--red-text); }
.b-recursa { background:var(--amber-bg); color:var(--amber-text); }
.b-ausente { background:var(--gray-bg); color:var(--gray-text); }
.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.clase-row { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.clase-fecha { min-width:74px; font-weight:700; font-size:13px; }
.stat { text-align:center; padding:14px; background:var(--surface2); border-radius:10px; }
.stat-val { font-size:20px; font-weight:700; }
.stat-lbl { font-size:11px; color:var(--text3); }
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
.att-pill { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:6px; font-size:12px; font-weight:700; }
.att-P { background:var(--green-bg); color:var(--green-text); }
.att-A { background:var(--red-bg); color:var(--red-text); }
.att-T { background:var(--amber-bg); color:var(--amber-text); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Portal de Estudiantes</h1>
  <p class="muted" style="margin-bottom:20px">MAGISTRO — Consultá tu cronograma, tus notas y tu asistencia.</p>

  <!-- LOGIN por DNI -->
  <div id="view-login" class="card" style="max-width:420px">
    <div id="login-error" class="error-box"></div>
    <label class="muted" style="display:block;margin-bottom:6px">Ingresá tu DNI</label>
    <input id="dni-input" inputmode="numeric" placeholder="Ej: 34567890" onkeydown="if(event.key==='Enter')doLoginDni()">
    <button onclick="doLoginDni()">Ingresar</button>
    <p class="muted" style="margin-top:16px;font-size:12.5px">¿Sos docente? <a href="docente.html" style="color:var(--text2)">Entrá por acá</a></p>
  </div>

  <!-- SELECCIÓN DE CURSO (si el DNI está en más de una comisión) -->
  <div id="view-elegir" class="card" style="display:none;max-width:520px">
    <p class="muted" style="margin-bottom:14px">Encontramos varios cursos con tu DNI. Elegí cuál querés ver:</p>
    <div id="opciones-list"></div>
    <button class="secondary" onclick="resetLogin()">Volver</button>
  </div>

  <!-- APP DEL ESTUDIANTE -->
  <div id="view-app" style="display:none">
    <div class="top-bar">
      <div>
        <div style="font-weight:700;font-size:16px" id="est-nombre"></div>
        <div class="muted" id="est-curso"></div>
      </div>
      <button class="secondary" onclick="doLogout()">Cerrar sesión</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="cronograma" onclick="switchTab('cronograma')">Cronograma</div>
      <div class="tab" data-tab="notas" onclick="switchTab('notas')">Notas</div>
      <div class="tab" data-tab="asistencia" onclick="switchTab('asistencia')">Asistencia</div>
    </div>

    <div class="card" id="tab-content"></div>
  </div>
</div>

<script>
const DIAS  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ROMAN = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

let currentData = null;
let currentTab = 'cronograma';
let pendingDni = null;

// ── Lógica de notas (idéntica a la app del docente) ──
function needsRec(p1,p2){if(!p1||!p2)return false;if(String(p1).toUpperCase()==='A'||String(p2).toUpperCase()==='A')return false;const n1=Number(p1),n2=Number(p2);if(isNaN(n1)||isNaN(n2))return false;return(n1+n2)<=7&&(n1>=4||n2>=4);}
function calcFinal(p1,p2,rec){if(p1===''||p2==='')return '';if(String(p1).toUpperCase()==='A'||String(p2).toUpperCase()==='A')return 'A';const n1=Number(p1),n2=Number(p2);if(isNaN(n1)||isNaN(n2))return '';if(needsRec(p1,p2)){if(!rec)return '';if(rec==='Aprobado')return 4;if(rec==='Desaprobado')return Math.ceil((n1+n2)/2);}return Math.ceil((n1+n2)/2);}
function calcSituacion(p1,p2,final,rec){if(final==='')return '';if(final==='A')return 'RECURSA';if(needsRec(p1,p2)&&!rec)return '';if(needsRec(p1,p2)&&rec==='Aprobado')return 'APROBADO / VA A FINAL';if(needsRec(p1,p2)&&rec==='Desaprobado')return 'REPROBADO / RECURSA';const f=Number(final);if(f>=7)return 'PROMOCIONADO';if(f>=4)return 'APROBADO / VA A FINAL';return 'REPROBADO / RECURSA';}
function badgeClass(sit){if(sit==='PROMOCIONADO')return 'badge b-promo';if(sit==='APROBADO')return 'badge b-promo';if(sit==='APROBADO / VA A FINAL')return 'badge b-aprobado';if(sit==='DESAPROBADO')return 'badge b-reprobado';if(sit==='REPROBADO / RECURSA')return 'badge b-reprobado';if(sit==='RECURSA')return 'badge b-recursa';return 'badge b-ausente';}
function tipoLabel(tipo){return tipo==='teorica'?'Teórica':tipo==='practica'?'Práctica':tipo==='teorico-practica'?'Teórico-Práctica':'Examen';}
function unidadLabel(u){return u?`${ROMAN[u.numero]||u.numero}. ${u.nombre}`:'';}

function getClassDatesFromRange(p){
  const dates = [];
  if (!p || !p.days || !p.days.length) return dates;
  let start, end;
  if (p.fechaInicio && p.fechaFin) {
    start = new Date(p.fechaInicio + 'T12:00:00');
    end   = new Date(p.fechaFin   + 'T12:00:00');
  } else {
    const anio = p.anio || new Date().getFullYear();
    start = new Date(anio, p.mesInicio||2, 1);
    end   = new Date(anio, (p.mesFin||6)+1, 0);
  }
  let cur = new Date(start);
  while (cur <= end) {
    if (p.days.includes(cur.getDay())) dates.push(new Date(cur));
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}

function showError(id, msg){
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = '';
}
function hideError(id){ document.getElementById(id).style.display = 'none'; }

function showView(name){
  ['login','elegir','app'].forEach(v => {
    document.getElementById('view-' + v).style.display = (v === name) ? '' : 'none';
  });
}

async function doLoginDni(){
  hideError('login-error');
  const dni = document.getElementById('dni-input').value.trim();
  if (!dni) return showError('login-error', 'Ingresá tu DNI.');
  try {
    const res = await fetch('/api/estudiante/login', {
      method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type':'application/json'}, body: JSON.stringify({ dni })
    });
    const data = await res.json();
    if (!res.ok) return showError('login-error', data.error || 'No se pudo ingresar.');
    if (data.seleccionado) {
      await loadAndShowApp();
    } else {
      pendingDni = data.dni;
      renderOpciones(data.opciones);
      showView('elegir');
    }
  } catch(e) { showError('login-error', 'Error de conexión con el servidor.'); }
}

function renderOpciones(opciones){
  const list = document.getElementById('opciones-list');
  list.innerHTML = '';
  opciones.forEach(op => {
    const div = document.createElement('div');
    div.className = 'opcion';
    div.innerHTML = `<div style="font-weight:600">${escHtml(op.materia||'')}</div>
      <div class="muted" style="font-size:12.5px">Comisión ${escHtml(op.comision||'')} · Docente: ${escHtml(op.docente||'')}</div>`;
    div.onclick = () => elegirComision(op.comisionId);
    list.appendChild(div);
  });
}

async function elegirComision(comisionId){
  try {
    const res = await fetch('/api/estudiante/elegir', {
      method: 'POST', credentials: 'same-origin',
      headers: {'Content-Type':'application/json'}, body: JSON.stringify({ dni: pendingDni, comisionId })
    });
    const data = await res.json();
    if (!res.ok) return showError('login-error', data.error || 'No se pudo ingresar.');
    await loadAndShowApp();
  } catch(e) { showError('login-error', 'Error de conexión con el servidor.'); }
}

function resetLogin(){
  showView('login');
}

async function loadAndShowApp(){
  try {
    const res = await fetch('/api/estudiante/data', { credentials: 'same-origin' });
    if (!res.ok) { showView('login'); return; }
    currentData = await res.json();
    document.getElementById('est-nombre').textContent = currentData.estudiante.nombre || 'Estudiante';
    document.getElementById('est-curso').textContent =
      (currentData.curso.materia || '') + (currentData.curso.comision ? ' · Comisión ' + currentData.curso.comision : '');
    showView('app');
    switchTab(currentTab);
  } catch(e) { showView('login'); }
}

async function doLogout(){
  try { await fetch('/api/logout', { method:'POST', credentials:'same-origin' }); } catch(e){}
  currentData = null;
  document.getElementById('dni-input').value = '';
  showView('login');
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const content = document.getElementById('tab-content');
  if (tab === 'cronograma') content.innerHTML = renderCronograma();
  else if (tab === 'notas') content.innerHTML = renderNotas();
  else content.innerHTML = renderAsistencia();
}

function escHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderCronograma(){
  const planning = currentData.cronograma.planning;
  const unidades = currentData.cronograma.unidades || [];
  if (!planning || !planning.days || !planning.days.length) {
    return '<p class="muted">Tu docente todavía no cargó el cronograma de este curso.</p>';
  }
  const dates = getClassDatesFromRange(planning);
  const clases = planning.clases || [];
  let html = '';
  dates.forEach((d, i) => {
    const cl = clases[i] || {};
    const fecha = `${DIAS[d.getDay()].slice(0,2)} ${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}`;
    const unidad = unidades.find(u => u.id === cl.unidad);
    html += `<div class="clase-row">
      <div class="clase-fecha">${fecha}</div>
      <div style="flex:1">
        <div style="font-size:12.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em">${tipoLabel(cl.tipo||'teorica')}${unidad?' · '+escHtml(unidadLabel(unidad)):''}</div>
        <div>${escHtml(cl.tema || '')}</div>
        ${cl.obs ? `<div class="muted" style="font-size:12.5px;margin-top:2px">${escHtml(cl.obs)}</div>` : ''}
      </div>
    </div>`;
  });
  return html || '<p class="muted">Todavía no hay clases planificadas.</p>';
}

function renderNotas(){
  const n = currentData.notas;
  const final = calcFinal(n.p1, n.p2, n.rec);
  const sit = calcSituacion(n.p1, n.p2, final, n.rec);
  return `<table>
    <tr><th>1er parcial</th><th>2do parcial</th><th>Recuperatorio</th><th>Nota final</th><th>Situación</th></tr>
    <tr>
      <td>${n.p1 !== '' ? n.p1 : '—'}</td>
      <td>${n.p2 !== '' ? n.p2 : '—'}</td>
      <td>${n.rec || '—'}</td>
      <td>${final !== '' ? final : '—'}</td>
      <td>${sit ? `<span class="${badgeClass(sit)}">${sit}</span>` : '—'}</td>
    </tr>
  </table>`;
}

function renderAsistencia(){
  const { dates, skipWeeks, misRegistros } = currentData.asistencia;
  if (!dates || !dates.length) return '<p class="muted">Todavía no hay fechas de asistencia cargadas.</p>';
  const activeDates = dates.filter(d => !skipWeeks[d]);
  const recorded = activeDates.filter(d => misRegistros[d]);
  const presentes = recorded.filter(d => misRegistros[d] === 'P').length;
  const pct = recorded.length ? Math.round(presentes / recorded.length * 100) : 0;

  let html = `<div class="stats-row">
    <div class="stat"><div class="stat-val">${activeDates.length}</div><div class="stat-lbl">Clases</div></div>
    <div class="stat"><div class="stat-val">${presentes}</div><div class="stat-lbl">Presentes</div></div>
    <div class="stat"><div class="stat-val" style="color:${pct>=75?'var(--green-text)':pct>=50?'var(--amber-text)':'var(--red-text)'}">${pct}%</div><div class="stat-lbl">Asistencia</div></div>
  </div>`;
  html += '<table><tr><th>Fecha</th><th>Estado</th></tr>';
  dates.forEach(d => {
    const dd = new Date(d + 'T12:00:00');
    const fecha = `${DIAS[dd.getDay()].slice(0,2)} ${dd.getDate().toString().padStart(2,'0')}/${(dd.getMonth()+1).toString().padStart(2,'0')}`;
    let estado;
    if (skipWeeks[d]) {
      estado = `<span class="muted">${skipWeeks[d] === 'vacaciones' ? 'Vacaciones' : skipWeeks[d] === 'licencia' ? 'Licencia' : 'Feriado'}</span>`;
    } else {
      const v = misRegistros[d] || '';
      const label = v === 'P' ? 'Presente' : v === 'A' ? 'Ausente' : v === 'T' ? 'Tarde' : 'Sin registrar';
      estado = v ? `<span class="att-pill att-${v}">${v}</span> ${label}` : `<span class="muted">${label}</span>`;
    }
    html += `<tr><td>${fecha}</td><td>${estado}</td></tr>`;
  });
  html += '</table>';
  return html;
}

// ── Bootstrap: si ya había sesión de estudiante activa, entrar directo ──
(async function boot(){
  try {
    const res = await fetch('/api/me', { credentials: 'same-origin' });
    if (res.ok) {
      const me = await res.json();
      if (me.role === 'estudiante') { await loadAndShowApp(); return; }
    }
  } catch(e) {}
  showView('login');
})();
</script>
</body>
</html>
